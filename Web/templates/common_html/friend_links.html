<!-- 友情连接（全站公共组件：由 common_html/footer.html 顶部引入，所有页面自动展示） -->
<!-- 链接由后端统一请求小影 API 获取（Web/services/friend_links.py，缓存1小时），渲染进 HTML 供搜索引擎直接可见 -->
<div class="layui-container">
    <div class="layui-row">
        <div class="link">
            <h2>友情连接</h2>
            <div>
                {% for link in friend_links %}
                <a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.name }}</a>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
